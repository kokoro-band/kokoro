name: 작업
description: 구현이나 설계나 운영 작업을 등록합니다.
title: "[Task] "
labels:
  - "type:task"
assignees: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업이 완료되면 달라지는 결과를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 작업과 포함하지 않을 작업을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 완료 여부를 확인할 수 있는 조건을 적어주세요.
      placeholder: |
        - [ ] 첫 번째 완료 조건
        - [ ] 두 번째 완료 조건
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고
      description: 관련 링크나 제약 사항이 있다면 적어주세요.
