name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test .github/scripts/ci-changes.test.mjs
      - id: filter
        run: node .github/scripts/ci-changes.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          working-directory: frontend
          node-version: 22
          cache: true
      - run: vp check
      - run: vp test
      - run: vp run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw --batch-mode test
      - run: ./mvnw --batch-mode package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  ci-result:
    name: CI result
    if: always()
    needs: [changes, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          NEEDS_FRONTEND: ${{ needs.changes.outputs.frontend }}
          NEEDS_BACKEND: ${{ needs.changes.outputs.backend }}
        run: |
          node --input-type=module <<'JS'
          import { assertResults } from './.github/scripts/ci-changes.mjs'
          assertResults({
            changes: process.env.CHANGES_RESULT,
            frontend: process.env.FRONTEND_RESULT,
            backend: process.env.BACKEND_RESULT,
            needsFrontend: process.env.NEEDS_FRONTEND,
            needsBackend: process.env.NEEDS_BACKEND,
          })
          JS
