name: GitHub Pages 데모

on:
  push:
    branches:
      - main
      - codex/github-pages-demo
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_MODE: local
      VITE_BASE_PATH: /kokoro/
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          working-directory: frontend
          node-version: 22
          cache: true
      - run: vp check
      - run: vp test
      - run: vp run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/github-pages-demo')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: 데모 게시
        id: deployment
        uses: actions/deploy-pages@v4
