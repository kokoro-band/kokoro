app:
  security:
    mode: demo
    demo:
      # name:bcryptHash pairs separated by commas. Set only through the environment.
      accounts: ${DEMO_ACCOUNTS:}
      # At least 32 bytes. Set only through the environment.
      jwt-secret: ${DEMO_JWT_SECRET:}
      token-ttl: ${DEMO_TOKEN_TTL:PT12H}
      # Most accounts the sign-up creates. Once reached, sign-up is refused until accounts are removed.
      max-users: ${DEMO_MAX_USERS:200}
