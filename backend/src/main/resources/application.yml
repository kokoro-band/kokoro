spring:
  profiles:
    default: local
  application:
    name: kokoro-remodel-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kokoro}
    username: ${DB_USERNAME:kokoro}
    password: ${DB_PASSWORD:kokoro}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    mode: ${SECURITY_MODE:local}
    local-user: ${LOCAL_USER_ID:local-user}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  floor-plan-storage-root: ${FLOOR_PLAN_STORAGE_ROOT:${java.io.tmpdir}/kokoro/floor-plans}
