spring:
  application:
    name: kokoro-remodel-api
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
